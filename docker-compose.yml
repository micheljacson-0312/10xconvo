# ═══════════════════════════════════════════════════════════════════════════
#  TenXConvo — Docker Compose (Full Stack)
#
#  Usage:
#    docker-compose up -d          → start all services
#    docker-compose logs -f api    → watch API logs
#    docker-compose down           → stop everything
#
#  Before first run:
#    1. Copy appsettings.Production.example.json → appsettings.Production.json
#    2. Fill in ALL credentials
#    3. Create .env.production in each frontend portal folder
#    4. Build frontends: cd admin-portal && npm run build (repeat for each)
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── .NET API Backend ─────────────────────────────────────────────────────
  api:
    build:
      context: ./TenXConvo_v2
      dockerfile: Dockerfile
    container_name: tenxconvo-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      # Persist uploaded files outside the container
      - uploads_data:/app/wwwroot/uploads
      # Mount production config (credentials)
      - ./TenXConvo_v2/src/TenXConvo.API/appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (SignalR backplane + caching) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tenxconvo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Admin Portal (static files via Nginx) ────────────────────────────────
  admin:
    image: nginx:alpine
    container_name: tenxconvo-admin
    ports:
      - "3000:80"
    volumes:
      - ./tenx-frontend/admin-portal/dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ── Consultant Portal ────────────────────────────────────────────────────
  consultant:
    image: nginx:alpine
    container_name: tenxconvo-consultant
    ports:
      - "3002:80"
    volumes:
      - ./tenx-frontend/consultant-portal/dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ── User Portal ──────────────────────────────────────────────────────────
  user:
    image: nginx:alpine
    container_name: tenxconvo-user
    ports:
      - "3004:80"
    volumes:
      - ./tenx-frontend/user-portal/dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  uploads_data:
  redis_data:
